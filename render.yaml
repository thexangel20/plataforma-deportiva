services:
  - type: web
    name: sportsinfo
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT 'sportsinfo:create_app()'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DATA_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://ddwqetqgeotnohpdlqgz.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SPORTSINFO_BUCKET
        value: sportsinfo-imagenes
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
